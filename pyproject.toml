[project]
name = "salsa"
version = "0.2.4"
description = "Simple timesheet CLI"
authors = [{name = "Andrea Manenti", email = "andrea.manenti@proton.me"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyperclip>=1.11.0"
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[project.scripts]
salsa = "salsa.__main__:main"

[tool.ruff]
line-length = 120